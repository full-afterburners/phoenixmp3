<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
  "use strict";
  // In the desktop app (app.pyw opens this page with ?desktop) the library, genre tree and
  // Last.fm albums come from Python through window.pywebview.api. Anywhere else (the claude.ai
  // mockup) they come from JSON snapshots next to the page. demo.json (sample search results)
  // is used in both until the real search is wired in.
  const IN_APP = new URLSearchParams(location.search).has("desktop");
  const apiReady = IN_APP ? new Promise(res => {
    if (window.pywebview && window.pywebview.api && window.pywebview.api.load) res();
    else window.addEventListener("pywebviewready", res, { once: true });
  }) : null;
  const fetchJSON = url => fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  const load = name => IN_APP ? apiReady.then(() => window.pywebview.api.load(name)) : fetchJSON(name + ".json");
  const errText = e => (e && (e.message || e.toString())) || "unknown error";
  let DEMO = null;
  // Playlists and settings are still only in the classic window (gui.pyw), so it stays a click away.
  if (IN_APP) document.querySelector(".mock-tag")?.replaceWith(h("button", { class: "btn small", type: "button", id: "classicBtn",
    title: "The classic phoenixmp3 window, for playlists and settings until this one has them",
    onclick: () => apiReady.then(() => window.pywebview.api.open_classic()).then(() => toast("Opening the classic window…"), e => toast(`Couldn't open it (${errText(e)})`)) },
    "Classic Window"));
  let theme = "dark";
  try { theme = localStorage.getItem("phx-theme") || "dark"; } catch (e) {}
  const applyTheme = t => { if (t === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; };
  applyTheme(theme);
  const $ = id => document.getElementById(id);
  const view = $("view");
  let L = null;   // library data
  let loadError = "";   // why the library couldn't load, shown on every page instead of "Loading…"

  // ---------- tiny helpers ----------
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (k === "html") e.innerHTML = v;
      else e.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat(9)) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return e;
  }
  const icon = (name, cls = "i") => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("class", cls); const u = document.createElementNS("http://www.w3.org/2000/svg", "use"); u.setAttribute("href", "#i-" + name); s.append(u); return s; };
  const mins = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
  const norm = s => (s || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + "s")}`;
  const slug = s => encodeURIComponent(norm(s).replace(/ /g, "-") || "none");
  const fmtDate = t => new Date(t * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const HUES = [350, 18, 38, 160, 200, 230, 265, 300];
  function placeholder(text, cls = "art art-ph") {
    const n = [...(text || "?")].reduce((a, c) => a + c.charCodeAt(0), 0);
    const hue = HUES[n % HUES.length];
    return h("div", { class: cls, style: `background: linear-gradient(135deg, hsl(${hue} 70% 58%), hsl(${(hue + 40) % 360} 75% 45%))`, "aria-hidden": "true" },
      (text || "?").replace(/^the /i, "").slice(0, 1).toUpperCase());
  }
  const cover = (al, cls = "art") => al && al.cover ? h("img", { class: cls, src: al.cover, alt: "", loading: "lazy" }) : placeholder(al ? al.name : "?", cls + " art-ph");
  let toastTimer;
  function openMusicFolder() {   // sidebar "Music Folder" and Preferences > Music folder > Open
    if (!IN_APP) { toast(`Would open the ${L ? L.folder : "music"} folder`); return; }
    apiReady.then(() => window.pywebview.api.open_music_folder()).catch(e => toast(`Couldn't open it (${errText(e)})`));
  }
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }

  // ---------- derived library ----------
  let artists = [], genreMap = new Map(), libByMbid = new Map();
  function derive() {
    const byArtist = new Map();
    L.albums.forEach(al => {
      const key = norm(al.artist);
      if (!byArtist.has(key)) byArtist.set(key, { name: al.artist, albums: [], songs: 0 });
      const a = byArtist.get(key); a.albums.push(al); a.songs += al.songs.length;
    });
    artists = [...byArtist.values()].sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
    artists.forEach((a, i) => { a.id = i; a.albums.sort((x, y) => (y.year || 0) - (x.year || 0)); });
    // Each library artist's MusicBrainz id (the commonest one on their songs), for opening their profile
    libByMbid = new Map();
    artists.forEach(a => {
      const c = new Map();
      a.albums.forEach(al => al.songs.forEach(i => { const id = L.songs[i].aid; if (id) c.set(id, (c.get(id) || 0) + 1); }));
      a.mbid = [...c].sort((x, y) => y[1] - x[1])[0]?.[0] || null;
      if (a.mbid) libByMbid.set(a.mbid, a);
    });
    genreMap = new Map();
    L.songs.forEach((s, i) => { const g = s.g || "No genre"; if (!genreMap.has(g)) genreMap.set(g, []); genreMap.get(g).push(i); });
    $("nArtists").textContent = artists.length; $("nAlbums").textContent = L.albums.length; $("nSongs").textContent = L.songs.length;
    $("navPlaylists").replaceChildren(...L.playlists.map((p, i) => h("a", { href: "#playlists" }, icon("list"), p.name)));
    setIdle();
  }
  const artistOf = name => artists.find(a => norm(a.name) === norm(name));
  const albumSongs = al => al.songs.map(i => L.songs[i]);

  // ---------- views ----------
  const VIEWS = {
    recent: viewRecent, albums: viewAlbums, album: viewAlbum, artists: viewArtists, artist: viewArtist,
    songs: viewSongs, genres: viewGenres, genre: viewGenre, get: viewGet, activity: viewActivity,
    playlists: viewPlaylists, prefs: viewPrefs, mbartist: viewMbArtist, mbalbum: viewMbAlbum,
  };
  function route() {
    const raw = (location.hash || "#recent").slice(1);
    const [name, ...rest] = raw.split("-");
    const arg = rest.join("-");
    const fn = VIEWS[name] || viewRecent;
    document.querySelectorAll(".nav a").forEach(a => {
      const target = a.getAttribute("href").slice(1);
      const match = target === name || (name === "album" && target === "albums") || (name === "artist" && target === "artists") || (name === "genre" && target === "genres") || (name.startsWith("mb") && target === "get");
      a.toggleAttribute("aria-current", match); if (match) a.setAttribute("aria-current", "page");
    });
    $("app").classList.remove("open");
    if (!L) { view.replaceChildren(h("div", { class: "empty" }, loadError ? `Couldn't load the library (${loadError}).` : "Loading your library…")); return; }
    view.replaceChildren(fn(decodeURIComponent(arg)));
    view.scrollTop = 0;
  }
  const go = hash => { if (location.hash === "#" + hash) route(); else location.hash = hash; };

  function head(title, sub, ...actions) {
    return h("div", { class: "head" }, h("div", {}, h("h1", {}, title), sub ? h("p", { class: "sub" }, sub) : null), actions.length ? h("div", { class: "row" }, actions) : null);
  }
  function albumTile(al) {
    return h("a", { class: "tile", href: "#album-" + al.id }, cover(al), h("span", { class: "t1" }, al.name), h("span", { class: "t2" }, al.artist));
  }

  function viewRecent() {
    const sorted = [...L.albums].sort((a, b) => b.added - a.added);
    if (!sorted.length) return h("div", {}, head("Recently Added"), h("div", { class: "empty" }, "No music yet. ",
      h("a", { href: "#get", style: "color:var(--accent)" }, "Get Music"), " to download your first songs."));
    return h("div", {}, head("Recently Added"), h("div", { class: "grid" }, sorted.slice(0, 60).map(albumTile)));
  }
  function lastRun() {   // songs added in the most recent session (within 3 h of the newest)
    if (!L.songs.length) return null;
    const newest = Math.max(...L.songs.map(s => s.add));
    return L.songs.map((s, i) => [s, i]).filter(([s]) => newest - s.add < 3 * 3600).map(([, i]) => i);
  }
  function summarizeGenres(idxs) {
    const c = new Map(); idxs.forEach(i => { const g = L.songs[i].g || "No genre"; c.set(g, (c.get(g) || 0) + 1); });
    return [...c].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([g, n]) => `${g} ${n}`).join(", ");
  }

  let albumSort = "recent";
  function viewAlbums() {
    const sorts = {
      recent: (a, b) => b.added - a.added,
      artist: (a, b) => a.artist.localeCompare(b.artist, undefined, { sensitivity: "base" }) || a.name.localeCompare(b.name),
      title: (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }),
      year: (a, b) => (b.year || 0) - (a.year || 0),
    };
    const grid = h("div", { class: "grid" });
    const fill = () => grid.replaceChildren(...[...L.albums].sort(sorts[albumSort]).map(albumTile));
    const sel = h("select", { class: "select", id: "albumSort", "aria-label": "Sort albums", onchange: e => { albumSort = e.target.value; fill(); } },
      ...Object.entries({ recent: "Recently Added", artist: "Artist", title: "Title", year: "Year" }).map(([v, t]) => h("option", { value: v, selected: v === albumSort }, t)));
    fill();
    return h("div", {}, head("Albums", `${plural(L.albums.length, "album")}, singles included`, sel), grid);
  }

  // "You have 5 of 14 songs · Get the Rest" on an album page, only when some are missing. The count
  // comes from the library when MusicBrainz tagged the album (al.total), else Python looks the album
  // up by name (cached a week): the box stays hidden until then, and for good when you have at least
  // the standard edition's tracks. Unknown albums keep the plain "N songs from this album" box.
  function getRest(al, have, sample) {
    const tickets = sample && !IN_APP;   // the mockup's sample album only
    const box = h("div", { class: "callout", id: "getRest", hidden: true });
    const show = (tracks, rg) => {
      if (tracks && have >= tracks) return;
      box.replaceChildren(
        h("span", {}, h("b", {}, `You have ${tracks ? `${have} of ${tracks} songs` : plural(have, "song")}`),
          tickets ? " of 15 on the standard edition." : tracks ? " on the standard edition." : " from this album."),
        h("button", { class: "btn primary", type: "button", onclick: () => {
          if (IN_APP && rg) { go("mbalbum-" + rg); return; }   // the album's own page: tick what's missing
          getState.q = `${al.name} ${al.artist}`; getState.pick = tickets ? 0 : null; go("get");
        } }, icon("get"), "Get the Rest"));
      box.hidden = false;
    };
    if (!IN_APP) { if (tickets || have > 1) show(null, null); return box; }   // the mockup: sample data
    if (al.total) { show(al.total, al.rg); return box; }
    if (have < 2 && !al.rg) return box;   // one song that isn't a single: not worth a lookup
    const ask = al.lookup || (al.lookup = apiReady.then(() => window.pywebview.api.library_album(al.name, al.artist))
      .catch(() => { al.lookup = null; return {}; }));   // offline: try again next time the page opens
    ask.then(r => show(r.tracks, r.rg || al.rg));
    return box;
  }

  function viewAlbum(id) {
    const al = L.albums[+id];
    if (!al) return h("div", { class: "empty" }, "That album isn't in your library.");
    const songs = albumSongs(al).sort((a, b) => (a.n || 99) - (b.n || 99) || a.t.localeCompare(b.t));
    const total = songs.reduce((t, s) => t + s.len, 0);
    const isSingle = songs.length === 1 && norm(songs[0].t) === norm(al.name);
    const a = artistOf(al.artist);
    const tickets = norm(al.name).includes("tickets to my downfall");
    const frag = h("div", {});
    frag.append(h("div", { class: "album-hero" }, cover(al),
      h("div", {},
        h("h1", {}, al.name),
        a ? h("a", { class: "by", href: "#artist-" + a.id }, al.artist) : h("span", { class: "by" }, al.artist),
        h("p", { class: "meta" }, [al.genre || "No genre", al.year, isSingle ? "Single" : null].filter(Boolean).join(" · ")),
        h("p", { class: "note" }, `${plural(songs.length, "song")}, ${Math.round(total / 60)} min · ${songs[0].ext.toUpperCase()}`),
        h("div", { class: "row" },
          h("button", { class: "btn", type: "button", id: "showInFolder", onclick: () => IN_APP
            ? window.pywebview.api.show_song(songs[0].id).catch(e => toast(`Couldn't show it (${errText(e)})`))
            : toast(`Would open ${L.folder}\\${songs[0].f}`) }, icon("folder"), "Show in Folder"),
          h("button", { class: "btn", type: "button", onclick: () => toast("Would re-pick this album's genre with your current genre settings") }, icon("refresh"), "Re-file Genre")),
        isSingle ? null : getRest(al, songs.length, tickets))));
    frag.append(h("table", { class: "tbl" },
      h("thead", {}, h("tr", {}, h("th", { class: "num" }, "#"), h("th", {}, "Title"), h("th", {}, "File"), h("th", { class: "time" }, "Time"))),
      h("tbody", {}, songs.map((s, i) => h("tr", { class: "r" },
        h("td", { class: "num" }, s.n || i + 1), h("td", {}, s.t), h("td", { class: "dim" }, s.f), h("td", { class: "time" }, mins(s.len)))))));
    return frag;
  }

  let artistSort = "name";
  function viewArtists() {
    const sorts = {
      name: (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }),
      songs: (a, b) => b.songs - a.songs || a.name.localeCompare(b.name),
      recent: (a, b) => Math.max(...b.albums.map(x => x.added)) - Math.max(...a.albums.map(x => x.added)),
    };
    const grid = h("div", { class: "avatars" });
    const fill = () => grid.replaceChildren(...[...artists].sort(sorts[artistSort]).map(a => h("a", { class: "avatar", href: "#artist-" + a.id },
      a.albums[0].cover ? h("img", { src: a.albums[0].cover, alt: "", loading: "lazy" }) : placeholder(a.name, "art-ph"),
      h("span", {}, a.name), h("small", {}, plural(a.songs, "song")))));
    const sel = h("select", { class: "select", id: "artistSort", "aria-label": "Sort artists", onchange: e => { artistSort = e.target.value; fill(); } },
      Object.entries({ name: "Name", songs: "Most Songs", recent: "Recently Added" }).map(([v, t]) => h("option", { value: v, selected: v === artistSort }, t)));
    fill();
    return h("div", {}, head("Artists", plural(artists.length, "artist"), sel), grid);
  }
  function viewArtist(id) {
    const a = artists[+id];
    if (!a) return h("div", { class: "empty" }, "That artist isn't in your library.");
    const songs = a.albums.flatMap(al => al.songs);
    return h("div", {},
      head(a.name, `${plural(a.albums.length, "album")} · ${plural(a.songs, "song")}`,
        IN_APP && a.mbid ? h("a", { class: "btn primary", id: "profileBtn", href: "#mbartist-" + a.mbid }, icon("search"), "Artist Profile")
          : h("button", { class: "btn", type: "button", onclick: () => { getState.q = a.name; getState.tab = "albums"; go("get"); } }, icon("search"), "Find More by " + a.name)),
      h("div", { class: "grid" }, a.albums.map(albumTile)),

          h("div", { class: "pref" }, h("div", {}, h("b", {}, "Folder layout"), h("small", {}, "Example: ", example)), seg("layout", { flat: "One folder", folders: "Artist / Album" }, showEx)),
          pref("Square cover art", "Crops YouTube's widescreen thumbnails to square.", sw("square_art", "sqArt", syncSmall)),

          pref("Playlist files", "Writes an .m3u8 for each of My Playlists when you update them.", sw("playlist_files", "plf")))),
        h("div", { class: "group" }, h("h3", {}, "Genres"), h("div", { class: "card" },
          pref("Genre settings", "Which genres to use, where tags come from and how sub-genres group are set in the Genres tab, which shows how many songs a change moves.",
            h("button", { class: "btn", type: "button", onclick: () => go("genres") }, icon("chart"), "Open Genres")),

        h("div", { class: "group" }, h("h3", {}, "Appearance"), h("div", { class: "card" },

        h("div", { class: "group" }, h("h3", {}, "About"), h("div", { class: "card" },
          pref("phoenixmp3", "How it works, and the free open source tools it's built on.", h("div", { class: "row" },
            ...[["readme", "Read Me"], ["notices", "Licences"]].map(([doc, text]) => h("button", { class: "btn", type: "button",
              onclick: () => window.pywebview.api.open_doc(doc).catch(e => toast(`Couldn't open it (${errText(e)})`)) }, text))))))));
  }

  function viewPrefs() {
    if (IN_APP) return viewPrefsApp();
    const s = prefsState;
    const seg = (key, opts) => h("div", { class: "seg", role: "group" }, Object.entries(opts).map(([v, t]) => h("button", { type: "button", "aria-pressed": String(s[key] === v),
      onclick: e => { s[key] = v; [...e.target.parentNode.children].forEach(b => b.setAttribute("aria-pressed", String(b === e.target))); saved(); } }, t)));
    const sw = (key, id) => h("label", { class: "switch" }, h("input", { type: "checkbox", id, checked: s[key], role: "switch", onchange: e => { s[key] = e.target.checked; saved(); } }), h("span", {}));
    const pref = (title, desc, control) => h("div", { class: "pref" }, h("div", {}, h("b", {}, title), h("small", {}, desc)), control);
    const example = h("code", {}, "");
    const showEx = () => example.textContent = s.layout === "flat" ? "mgk - drunk face.m4a" : "mgk\\Tickets To My Downfall\\drunk face.m4a";
    const layoutSeg = seg("layout", { flat: "One folder", folders: "Artist / Album" });
    layoutSeg.addEventListener("click", showEx); showEx();
    const pauseOut = h("span", { class: "note", style: "width:40px" }, s.pause + " s");
    const confirmRow = h("div", { class: "pref", hidden: true },
      h("div", {}, h("b", {}, "Re-file every song?"), h("small", {}, "Songs whose genre you set by hand keep it. Nothing downloads; it uses saved Last.fm tags.")),
      h("div", { class: "row" }, h("button", { class: "btn", type: "button", onclick: () => confirmRow.hidden = true }, "Cancel"),
        h("button", { class: "btn primary", type: "button", onclick: () => { confirmRow.hidden = true; toast("Would re-file genres for your whole library"); } }, "Re-file")));
    function saved() { toast("Saved"); }
    return h("div", {}, head("Preferences", "Changes apply to your next download"),
      h("div", { class: "prefs" },
        h("div", { class: "group" }, h("h3", {}, "Downloads"), h("div", { class: "card" },
          pref("Format", "AAC (.m4a) sounds better at the same size. MP3 plays everywhere.", seg("format", { aac: "AAC", mp3: "MP3" })),
          pref("Pause between songs", "Spacing downloads out keeps YouTube from blocking you.", h("div", { class: "range" },
            h("input", { type: "range", id: "pause", min: 0, max: 30, value: s.pause, "aria-label": "Seconds between songs", oninput: e => { s.pause = +e.target.value; pauseOut.textContent = s.pause + " s"; }, onchange: saved }), pauseOut)))),
        h("div", { class: "group" }, h("h3", {}, "Library"), h("div", { class: "card" },
          pref("Music folder", "Where finished songs go.", h("div", { class: "row" }, h("code", {}, L.folder), h("button", { class: "btn", type: "button", onclick: () => toast("Would open a folder picker") }, "Change…"))),
          h("div", { class: "pref" }, h("div", {}, h("b", {}, "Folder layout"), h("small", {}, "Example: ", example)), layoutSeg),
          pref("Square cover art", "Crops YouTube's wide thumbnails to square.", sw("square_art", "sqArt")),
          pref("Small cover art", "Smaller files for old iPods.", sw("small_art", "smArt")),
          pref("Even out loudness", "ReplayGain, so songs play at the same volume.", sw("replaygain", "rg")),
          pref("Playlist files", "Writes an .m3u8 for each of My Playlists.", sw("playlist_files", "plf")))),
        h("div", { class: "group" }, h("h3", {}, "Genres"), h("div", { class: "card" },
          pref("Look up tags by", "Album keeps every song on an album together.", seg("source", { track: "Song", album: "Album", artist: "Artist" })),
          pref("Group sub-genres by", "Music history puts dream pop under Rock; Sounds like puts it under Pop.", seg("family", { history: "Music history", sound: "Sounds like" })),
          pref("Genre list", "Switch genres on or off and drag styles around, right in the Genres tab.", h("button", { class: "btn", type: "button", onclick: () => go("genres") }, icon("chart"), "Open Genres")),
          pref("Re-file my library", "Apply these genre settings to songs you already have.", h("button", { class: "btn", type: "button", onclick: () => confirmRow.hidden = false }, icon("refresh"), "Re-file…")),
          confirmRow)),
        h("div", { class: "group" }, h("h3", {}, "Appearance"), h("div", { class: "card" },
          pref("Theme", "Dark unless you pick another. System follows Windows.", h("div", { class: "seg", role: "group" }, ["dark", "light", "system"].map(t => h("button", { type: "button",
            "aria-pressed": String(theme === t),
            onclick: e => { theme = t; applyTheme(t); try { localStorage.setItem("phx-theme", t); } catch (_) {}
              [...e.target.parentNode.children].forEach(b => b.setAttribute("aria-pressed", String(b === e.target))); } }, t[0].toUpperCase() + t.slice(1)))))))));
  }

  // ---------- wiring ----------
  $("lcd").addEventListener("click", () => go("activity"));
  $("menuBtn").addEventListener("click", () => $("app").classList.toggle("open"));
  view.addEventListener("click", e => { if (e.target === view) $("app").classList.remove("open"); });
  $("sideSearch").addEventListener("submit", e => { e.preventDefault(); getState.q = $("sideQ").value; getState.pick = null; go("get"); });
  $("openFolder").addEventListener("click", e => { e.preventDefault(); openMusicFolder(); });
  window.addEventListener("hashchange", route);
  route();
  Promise.all([load("data"), fetchJSON("demo.json")]).then(([d, demo]) => {
    DEMO = demo; L = d;
    Object.assign(prefsState, Object.fromEntries(Object.entries(d.settings || {}).filter(([k]) => k in prefsState)));
    useSavedRules();
    derive(); route();
    // a re-file started before the page reloaded keeps running in Python: show its progress again
    if (IN_APP) window.pywebview.api.refile_status().then(st => { if (st.running) watchRefile(); }, () => {});
    // the same for a download started before a reload
    if (IN_APP) window.pywebview.api.download_status().then(st => { if (st.running) { dl = st; watchDownload();
      if ((location.hash || "").startsWith("#activity")) route();   // already on Activity: show the run, not the last summary
    } }, () => {});
    // The theme is kept in Python too (app-prefs.json): WebView2 can lose a just-saved localStorage value
    if (IN_APP) window.pywebview.api.get_settings().then(r => {
      if (!r.theme) return window.pywebview.api.set_theme(theme);   // first start: keep the one the page remembered
      if (r.theme !== theme) { theme = r.theme; applyTheme(theme); try { localStorage.setItem("phx-theme", theme); } catch (_) {} }
    }).catch(() => {});
  }).catch(err => { loadError = errText(err); route(); });
})();

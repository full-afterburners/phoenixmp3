# beets config. Paths are relative to this folder. The app overrides directory,
# paths and plugins from its settings (see run-config.yaml).
directory: ../downloadswithmeta
library: library.db

# Older iPods can't read ID3v2.4.
id3v23: yes

import:
  move: yes
  write: yes
  quiet: yes
  quiet_fallback: asis   # keep YouTube's tags when there's no confident match
  resume: no
  log: import.log

paths:
  singleton: $artist - $title

# musicbrainz has to be listed in beets 2.x, otherwise chroma finds matches but
# nothing gets looked up and every song ends up as-is.
# ftintitle moves "feat. X" from the artist into the title.
plugins: musicbrainz chroma ftintitle

chroma:
  auto: yes

# Downloaded files have no data source set, which beets treats as a mismatch and
# penalises, so even perfect matches failed the threshold below.
musicbrainz:
  data_source_mismatch_penalty: 0.0

match:
  strong_rec_thresh: 0.10
